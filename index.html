<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0b09">
<title>S2K Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Hind+Siliguri:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0b09;--s1:#15130f;--s2:#1e1a13;--gold:#d6b36a;--gold2:#f1d99c;--text:#f3ede0;--muted:#8f887a;--line:#2b2518;--danger:#e0707e;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.6 "Hind Siliguri",system-ui,sans-serif;padding-bottom:calc(90px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.serif{font-family:Fraunces,Georgia,serif;font-weight:600}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:rgba(12,11,9,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-size:24px;letter-spacing:-.5px}
.logo i{color:var(--gold);font-style:normal}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--s1);font-weight:500;font-size:14px;transition:.2s}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(135deg,var(--gold2),#b78f45);color:#1a1307;border-color:transparent;font-weight:600}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}
.wrap{max-width:1100px;margin:auto;padding:0 14px}
.hero{padding:34px 4px 18px}
.hero h1{margin:0;font-size:clamp(34px,9vw,60px);line-height:1.05;letter-spacing:-1.5px}
.hero h1 em{font-style:italic;color:var(--gold)}
.hero p{margin:10px 0 0;color:var(--muted)}
.hero b{color:var(--text);font-weight:600}
.bar{position:sticky;top:calc(58px + env(safe-area-inset-top));z-index:9;background:var(--bg);padding:10px 0 8px}
.search{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--line);border-radius:999px;padding:0 16px}
.search:focus-within{border-color:var(--gold)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;padding:12px 0}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 0 2px}
.row::-webkit-scrollbar{display:none}
.pill{flex:none;padding:7px 15px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13.5px;transition:.2s}
.pill.on{background:var(--gold);color:#1a1307;border-color:var(--gold);font-weight:600}
.tabs{display:flex;gap:22px;border-bottom:1px solid var(--line);margin-top:6px}
.tab{padding:10px 0;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--gold);border-color:var(--gold)}
.grid{columns:2;column-gap:10px;margin-top:14px}
@media(min-width:640px){.grid{columns:3;column-gap:14px}}
@media(min-width:960px){.grid{columns:4}}
.card{break-inside:avoid;margin:0 0 10px;position:relative}
@media(min-width:640px){.card{margin-bottom:14px}}
.ph{display:block;width:100%;padding:0;border-radius:var(--r);overflow:hidden;background:var(--s2);position:relative}
.ph img{display:block;width:100%;height:auto;min-height:120px;object-fit:cover;transition:transform .35s}
.ph:hover img{transform:scale(1.04)}
.ph::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,rgba(0,0,0,.72));pointer-events:none}
.cap{position:absolute;left:11px;right:44px;bottom:9px;z-index:1;text-align:left;pointer-events:none}
.cap strong{display:block;font-weight:600;font-size:13.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cap span{font-size:11.5px;color:#d8d0bd}
.heart{position:absolute;right:8px;bottom:8px;z-index:2;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.45);font-size:18px;line-height:1;color:#fff;backdrop-filter:blur(6px)}
.heart.on{color:#ff7a8e}
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty h3{margin:0 0 6px;color:var(--text);font-size:19px}
.fab{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:12;width:58px;height:58px;border-radius:50%;font-size:28px;background:linear-gradient(135deg,var(--gold2),#b78f45);color:#1a1307;box-shadow:0 8px 28px rgba(214,179,106,.3)}
.backup{margin:40px 0 10px;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--s1)}
.backup p{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.backup .btns{display:flex;gap:8px;flex-wrap:wrap}
.overlay{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.78);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:min(520px,100%);max-height:92dvh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));animation:up .25s ease}
@media(min-width:640px){.overlay{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 4px;font-size:22px}
.sheet .sub{margin:0 0 16px;color:var(--muted);font-size:13px}
.field{display:grid;gap:6px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.field input,.field select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text)}
.field input[type=file]{padding:10px}
.field input:focus,.field select:focus{border-color:var(--gold);outline:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acts{display:flex;gap:8px;margin-top:6px}
.acts .btn{flex:1}
.viewer{position:fixed;inset:0;z-index:40;background:#050504;display:none;flex-direction:column}
.viewer.show{display:flex}
.vtop{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 8px}
.vtop .t{min-width:0}
.vtop h2{margin:0;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vtop span{font-size:12.5px;color:var(--muted)}
.x{flex:none;width:42px;height:42px;border-radius:50%;background:var(--s2);font-size:18px}
.stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;touch-action:pan-y}
.stage img{max-width:100%;max-height:100%;object-fit:contain}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;background:rgba(30,26,19,.8);font-size:20px}
.nav.l{left:10px}.nav.r{right:10px}
.vbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px 12px calc(14px + env(safe-area-inset-bottom))}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:60;max-width:90%;padding:11px 18px;border-radius:999px;background:var(--gold2);color:#1a1307;font-weight:500;font-size:14px;opacity:0;pointer-events:none;transition:.3s;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="logo serif">S2K<i>.</i></div>
  <button class="btn gold" id="openAdd">＋ ছবি যোগ করো</button>
</header>

<main class="wrap">
  <section class="hero">
    <h1 class="serif">Sabbir’s <em>Gallery</em></h1>
    <p><b id="total">0</b> ছবি · <b id="favs">0</b> প্রিয় · <b id="albums">0</b> অ্যালবাম — শুধু তোমার ফোনে</p>
  </section>

  <div class="bar">
    <label class="search"><span aria-hidden="true">⌕</span>
      <input type="search" id="search" placeholder="ছবি বা অ্যালবাম খোঁজো">
    </label>
    <div class="row" id="cats"></div>
    <nav class="tabs">
      <button class="tab on" data-tab="all">Gallery</button>
      <button class="tab" data-tab="favorites">Favorites</button>
      <button class="tab" data-tab="albums">Albums</button>
    </nav>
    <div class="row" id="chips"></div>
  </div>

  <div id="gallery" class="grid"></div>

  <section class="backup">
    <p>ছবি শুধু এই ব্রাউজারে থাকে। ব্রাউজার ডেটা মুছলে ছবি হারাবে, তাই মাঝে মাঝে Backup নাও।</p>
    <div class="btns">
      <button class="btn" id="backup">সব ছবি Download</button>
      <button class="btn" id="exportData">তথ্য Export</button>
      <button class="btn" id="restore">তথ্য Import</button>
      <input id="backupFile" type="file" accept="application/json,.json" hidden>
    </div>
  </section>
</main>

<button class="fab" id="fab" aria-label="ছবি যোগ করো">＋</button>

<div class="overlay" id="addSheet">
  <div class="sheet" role="dialog" aria-label="ছবি যোগ করো">
    <h2 class="serif">নতুন ছবি</h2>
    <p class="sub">JPG, PNG, WEBP বা GIF · প্রতি ছবি সর্বোচ্চ 15 MB</p>
    <label class="field">ছবি বেছে নাও
      <input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
    </label>
    <label class="field">নাম (ফাঁকা রাখলে ফাইলের নাম)
      <input id="title" type="text" maxlength="100" placeholder="ছবির নাম">
    </label>
    <div class="two">
      <label class="field">অ্যালবাম
        <input id="album" type="text" maxlength="60" value="My Photos">
      </label>
      <label class="field">ক্যাটাগরি
        <select id="category"></select>
      </label>
    </div>
    <div class="acts">
      <button class="btn" id="cancelAdd">বাতিল</button>
      <button class="btn gold" id="add">যোগ করো</button>
    </div>
  </div>
</div>

<div class="viewer" id="viewer">
  <div class="vtop">
    <div class="t"><h2 id="bigTitle"></h2><span id="bigMeta"></span></div>
    <button class="x" id="close" aria-label="বন্ধ করো">✕</button>
  </div>
  <div class="stage" id="stage">
    <button class="nav l" id="prev" aria-label="আগের ছবি">‹</button>
    <img id="bigImage" alt="">
    <button class="nav r" id="next" aria-label="পরের ছবি">›</button>
  </div>
  <div class="vbar">
    <button class="btn" id="bigFavorite">♡ প্রিয়</button>
    <button class="btn" id="bigEdit">Edit</button>
    <button class="btn" id="bigDownload">Download</button>
    <button class="btn danger" id="bigDelete">Delete</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const DB_NAME="S2KGalleryDB",STORE="photos";
const CATS=["Personal","Friends","Family","Travel","Gaming","Other"];
let db,photos=[],visible=[],currentTab="all",albumChip="All Albums",cat="All",selectedId=null,objectUrls=[],toastTimer;
const $=id=>document.getElementById(id);

function say(m){const t=$("toast");t.textContent=m;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),4000)}

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE,{keyPath:"id"})};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function transaction(mode,action){return new Promise((res,rej)=>{const tx=db.transaction(STORE,mode);let r;
  try{r=action(tx.objectStore(STORE))}catch(e){rej(e);return}
  tx.oncomplete=()=>res(r?.result);tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error)})}
function getAll(){return new Promise((res,rej)=>{const r=db.transaction(STORE,"readonly").objectStore(STORE).getAll();
  r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error)})}
function releaseUrls(){objectUrls.forEach(URL.revokeObjectURL);objectUrls=[]}
async function refresh(){photos=(await getAll()).sort((a,b)=>b.createdAt-a.createdAt);render()}

function pill(text,on,fn){const b=document.createElement("button");b.type="button";b.className="pill"+(on?" on":"");b.textContent=text;b.onclick=fn;return b}

function render(){
  releaseUrls();
  $("total").textContent=photos.length;
  $("favs").textContent=photos.filter(p=>p.favorite).length;
  $("albums").textContent=new Set(photos.map(p=>p.album)).size;

  const cats=$("cats");cats.replaceChildren();
  ["All",...CATS].forEach(c=>cats.append(pill(c==="All"?"সব":c,cat===c,()=>{cat=c;render()})));

  const chips=$("chips");chips.replaceChildren();
  chips.hidden=currentTab!=="albums";
  if(currentTab==="albums")["All Albums",...new Set(photos.map(p=>p.album))].forEach(n=>chips.append(pill(n,albumChip===n,()=>{albumChip=n;render()})));

  const q=$("search").value.trim().toLowerCase();
  visible=photos.filter(p=>{
    if(currentTab==="favorites"&&!p.favorite)return false;
    if(currentTab==="albums"&&albumChip!=="All Albums"&&p.album!==albumChip)return false;
    if(cat!=="All"&&p.category!==cat)return false;
    return(p.title+" "+p.album+" "+p.category).toLowerCase().includes(q);
  });

  const g=$("gallery");g.replaceChildren();
  if(!visible.length){
    g.style.columns="1";
    const e=document.createElement("div");e.className="empty";
    e.innerHTML="<h3></h3><p></p>";
    e.querySelector("h3").textContent=photos.length?"কোনো ছবি পাওয়া যায়নি":"তোমার Gallery খালি";
    e.querySelector("p").textContent=photos.length?"অন্য শব্দে খোঁজো বা ফিল্টার বদলাও।":"নিচের ＋ বোতামে চাপ দিয়ে প্রথম ছবি যোগ করো।";
    g.append(e);return;
  }
  g.style.columns="";
  for(const p of visible){
    const card=document.createElement("article");card.className="card";
    const open=document.createElement("button");open.className="ph";open.type="button";open.setAttribute("aria-label",p.title||"ছবি খোলো");
    const img=document.createElement("img");img.alt=p.title;img.loading="lazy";img.src=URL.createObjectURL(p.blob);objectUrls.push(img.src);
    const cap=document.createElement("div");cap.className="cap";
    const s=document.createElement("strong");s.textContent=p.title||"Untitled";
    const m=document.createElement("span");m.textContent=p.album;
    cap.append(s,m);open.append(img,cap);open.onclick=()=>showPhoto(p.id);
    const h=document.createElement("button");h.type="button";h.className="heart"+(p.favorite?" on":"");h.textContent=p.favorite?"♥":"♡";
    h.setAttribute("aria-label","প্রিয়");h.onclick=()=>toggleFavorite(p.id);
    card.append(open,h);g.append(card);
  }
}

function toggleSheet(show){$("addSheet").classList.toggle("show",show)}

async function addPhotos(){
  const files=Array.from($("files").files||[]);
  if(!files.length)return say("আগে ছবি বেছে নাও।");
  const valid=files.filter(f=>["image/jpeg","image/png","image/webp","image/gif"].includes(f.type)&&f.size<=15*1024*1024);
  if(valid.length!==files.length)say("কিছু ফাইল বাদ গেছে: শুধু JPG, PNG, WEBP, GIF; সর্বোচ্চ 15 MB।");
  if(!valid.length)return;
  $("add").disabled=true;let added=0;
  try{
    for(const file of valid){
      await transaction("readwrite",s=>s.put({
        id:crypto.randomUUID(),
        title:($("title").value.trim()||file.name.replace(/\.[^.]+$/,"")).slice(0,100),
        album:($("album").value.trim()||"My Photos").slice(0,60),
        category:$("category").value,favorite:false,createdAt:Date.now(),blob:file}));
      added++;
    }
    $("files").value="";$("title").value="";toggleSheet(false);
    await refresh();say(added+"টি ছবি যোগ হয়েছে।");
  }catch(e){say("Storage পূর্ণ হতে পারে। কিছু ছবি সরাও বা Backup নাও।")}
  finally{$("add").disabled=false}
}

async function toggleFavorite(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  p.favorite=!p.favorite;
  await transaction("readwrite",s=>s.put(p));
  const open=$("viewer").classList.contains("show");
  await refresh();if(open)showPhoto(id);
}
async function deletePhoto(id){
  const p=photos.find(x=>x.id===id);
  if(!p||!confirm(`"${p.title}" ছবিটি স্থায়ীভাবে Delete করবে?`))return;
  await transaction("readwrite",s=>s.delete(id));
  closeViewer();await refresh();say("ছবিটি মুছে ফেলা হয়েছে।");
}
async function editPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  const t=prompt("ছবির নাম:",p.title);if(t===null)return;
  const a=prompt("অ্যালবামের নাম:",p.album);if(a===null)return;
  p.title=t.trim().slice(0,100)||"Untitled";p.album=a.trim().slice(0,60)||"My Photos";
  await transaction("readwrite",s=>s.put(p));await refresh();showPhoto(id);
}
function downloadOne(p){
  const url=URL.createObjectURL(p.blob),a=document.createElement("a");
  a.href=url;a.download=(p.title||"S2K-photo").replace(/[\\/:*?"<>|]/g,"_")+"."+((p.blob.type.split("/")[1]||"jpg").replace("jpeg","jpg"));
  a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
}

function showPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  selectedId=id;
  const old=$("bigImage").src;
  $("bigImage").src=URL.createObjectURL(p.blob);
  if(old.startsWith("blob:"))URL.revokeObjectURL(old);
  const i=visible.findIndex(x=>x.id===id);
  $("bigTitle").textContent=p.title||"Untitled";
  $("bigMeta").textContent=p.album+" · "+p.category+(i>=0?" · "+(i+1)+"/"+visible.length:"");
  $("bigFavorite").textContent=p.favorite?"♥ প্রিয় থেকে সরাও":"♡ প্রিয়";
  $("viewer").classList.add("show");
}
function closeViewer(){$("viewer").classList.remove("show");$("bigImage").removeAttribute("src");selectedId=null}
function step(d){
  const i=visible.findIndex(x=>x.id===selectedId);if(i<0||visible.length<2)return;
  showPhoto(visible[(i+d+visible.length)%visible.length].id);
}

$("openAdd").onclick=$("fab").onclick=()=>toggleSheet(true);
$("cancelAdd").onclick=()=>toggleSheet(false);
$("addSheet").onclick=e=>{if(e.target===$("addSheet"))toggleSheet(false)};
$("add").onclick=addPhotos;
$("close").onclick=closeViewer;
$("prev").onclick=()=>step(-1);$("next").onclick=()=>step(1);
$("bigFavorite").onclick=()=>selectedId&&toggleFavorite(selectedId);
$("bigEdit").onclick=()=>selectedId&&editPhoto(selectedId);
$("bigDownload").onclick=()=>{const p=photos.find(x=>x.id===selectedId);if(p)downloadOne(p)};
$("bigDelete").onclick=()=>selectedId&&deletePhoto(selectedId);
document.addEventListener("keydown",e=>{
  if(!$("viewer").classList.contains("show"))return;
  if(e.key==="Escape")closeViewer();if(e.key==="ArrowLeft")step(-1);if(e.key==="ArrowRight")step(1);
});
let sx=null;
$("stage").addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
$("stage").addEventListener("touchend",e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>60)step(dx<0?1:-1);
});

document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{
  currentTab=b.dataset.tab;albumChip="All Albums";
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
$("search").oninput=render;
CATS.forEach(c=>{const o=document.createElement("option");o.textContent=c;$("category").append(o)});

$("exportData").onclick=()=>{
  const data=photos.map(({id,title,album,category,favorite,createdAt})=>({id,title,album,category,favorite,createdAt}));
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})),a=document.createElement("a");
  a.href=url;a.download="S2K-gallery-info.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
  say("তথ্য Export হয়েছে। এটি ছবির Backup নয়।");
};
$("backup").onclick=async()=>{
  if(!photos.length)return say("Backup করার মতো ছবি নেই।");
  if(!confirm(`${photos.length}টি ছবি আলাদাভাবে Download করবে?`))return;
  for(const p of photos){downloadOne(p);await new Promise(r=>setTimeout(r,350))}
  say("Download শুরু হয়েছে। ব্রাউজার অনুমতি চাইতে পারে।");
};
$("restore").onclick=()=>$("backupFile").click();
$("backupFile").onchange=async e=>{
  const f=e.target.files?.[0];if(!f)return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d)||!d.every(x=>typeof x.title==="string"&&typeof x.album==="string"&&typeof x.category==="string"))throw 0;
    say("এই ফাইলে শুধু তথ্য আছে, ছবি নেই। ছবি ফিরে পেতে মূল ছবি আবার যোগ করো।");
  }catch{say("ফাইলটি সঠিক নয়।")}
  e.target.value="";
};

(async function init(){
  try{db=await openDB();await refresh()}
  catch(e){render();say("এই ব্রাউজারে Storage চালু করা যায়নি। স্বাভাবিক মোডে চেষ্টা করো।")}
})();
</script>
</body>
